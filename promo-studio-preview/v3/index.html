/* Promo Studio v3: official identity and authentic creative portfolio */
.brand img.header-actual-logo {width:79px;height:74px;margin:-8px -6px -8px -10px;object-fit:contain;filter:drop-shadow(0 2px 4px #6d56f52a)}
.brandname {font-size:23px;letter-spacing:-.04em}
.footer-brand .hireberna-nameplate{width:min(265px,65vw);height:91px;object-fit:contain;object-position:left center;display:block}
.footrow{align-items:center}
.real-showcase{padding-top:68px}
.real-showcase .section-intro{max-width:780px}
.real-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:21px}
.real-card{background:#fff;border:2px solid #d9e0f6;border-radius:24px;overflow:hidden;box-shadow:6px 8px 0 #e9edfd;transition:transform .2s ease}
.real-card:hover{transform:translateY(-5px)}
.real-photo{height:auto;aspect-ratio:16/9;background:#f4f7ff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px}
.real-photo img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;transition:none}
.real-card:hover .real-photo img{transform:none}
.real-caption{padding:20px 22px 23px}
.real-caption .mini-category{font:800 10px/1.3 var(--body);color:#7141ba;letter-spacing:.13em}
.real-caption h3{font-size:22px;margin:9px 0 8px}
.real-caption p{font-size:13px;line-height:1.6;color:#535b75;margin-bottom:12px}
.real-caption a{color:#2659de;font-weight:900;font-size:13px}
.real-caption a:hover{text-decoration:underline}
@media(max-width:1050px){.real-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.brand img.header-actual-logo{width:62px;height:63px;margin:-4px -3px -4px -8px}.brandname{font-size:19px}.real-grid{grid-template-columns:1fr}.real-photo{height:auto;aspect-ratio:16/9}.real-showcase{padding-top:32px}.footer-brand .hireberna-nameplate{width:220px;height:75px}}

/* Motion-ready SVG demos, one compact art stage above each title */
.animated-feature{padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;align-self:stretch;transition:transform .2s ease,box-shadow .25s ease}
.animated-feature:hover,.animated-feature:focus-within{box-shadow:7px 10px 0 #e0defc}
.animated-feature .feature-art{position:relative;display:block;flex:0 0 auto;aspect-ratio:5/3;overflow:hidden;isolation:isolate;background:#eef7ff;cursor:pointer}
.animated-feature .feature-art:focus-visible{outline:4px solid #ff9c32;outline-offset:-4px}
.animated-feature .feature-art img{width:100%;height:100%;object-fit:contain;object-position:center;position:absolute;inset:0;pointer-events:none;user-select:none}
.animated-feature .feature-content{padding:18px 23px 24px;display:flex;flex-direction:column;flex:1;min-height:0;background:#fff}
.animated-feature .feature-content h3{margin:0 0 8px;line-height:1.22}
.animated-feature .feature-content p{color:#4a5578;line-height:1.55;margin:0 0 14px}
.animated-feature .feature-hint{margin-top:auto;letter-spacing:.065em;text-transform:uppercase;font-size:10px;font-weight:900;color:#6650db}
.animated-feature:nth-child(2) .feature-hint{color:#a752b1}
.animated-feature:nth-child(3) .feature-hint{color:#d57926}
.animated-feature:nth-child(4) .feature-hint{color:#ab5798}
.animated-feature:nth-child(5) .feature-hint{color:#397cc2}
.animated-feature:nth-child(6) .feature-hint{color:#b16b20}
@media(prefers-reduced-motion:reduce){.animated-feature,.animated-feature .feature-art img{animation:none!important;transition:none!important}}

 draft in the Editor.</p>${nav('/studio','Go to Studio ✦')}</div>`}</div>`}function contact(){return `<div class="shell"><section class="subhead"><span class="pill">Questions, ideas, big dreams?</span><h1 style="margin:20px 0">We'd love to<br><span class="gradientText">hear from you.</span></h1><p>Got a feature idea, a support question or interest in launch access? Tell us what's on your mind.</p></section><form class="sidebar contact-form" id="contactForm">${input('sender','Your name','')}<div class="field"><label for="email">Your email</label><input type="email" id="email" required placeholder="you@example.com"></div>${select('topic','What is on your mind?',[['Launch access','Launch access'],['Feature request','Feature request'],['Support question','Support question'],['Other','Other']],'Launch access')}<div class="field"><label for="message">Message</label><textarea id="message" required placeholder="Tell us a little more..."></textarea></div><button class="button" type="submit">Prepare Email ↗</button><p class="preview-note" style="margin-top:20px">This opens your email app. No message is sent automatically from this preview.</p></form></div>`}function policies(){return `<div class="shell legaltext"><section class="subhead"><span class="pill">Preview information</span><h1 style="margin:20px 0">Clear expectations.<br><span class="gradientText">Happy creating.</span></h1><p>Promo Studio is in active development and is not currently accepting payments.</p></section><h3>Media rights</h3><p>Upload only artwork and audio you own or have permission to use. The current preview runs its editing tools in your browser.</p><h3>Saving drafts</h3><p>Drafts are stored locally in your browser, not on a cloud account. Clearing browser storage can remove them, and they won't automatically appear on another device.</p><h3>Product pricing</h3><p>The displayed $30 launch-week price and $65 regular price are planned. A complete privacy policy, service terms and refund policy must be published before checkout opens.</p></div>`}function paint(){const old=$('#stageSlot');if(old)old.innerHTML=stage();const sc=$('#storySlot');if(sc)sc.innerHTML=storyboard();bindScenes()}function bindScenes(){$$('[data-scene]').forEach(b=>b.onclick=()=>{d.scene=Number(b.dataset.scene);saveDraft();const si=$('#sceneTitle');if(si)si.value=getSceneText();paint()})}function wire(){$$('[data-link]').forEach(a=>a.onclick=x=>{if(x.ctrlKey||x.metaKey)return;x.preventDefault();go(a.getAttribute('href'))});['brand','title','cta','details','style','ratio','pos','accent'].forEach(k=>{let el=$('#'+k);if(el)el.oninput=()=>{d[k]=k==='pos'?Number(el.value):el.value;saveDraft();paint()}});$$('[data-font]').forEach(b=>b.onclick=()=>{d.font=b.dataset.font;saveDraft();render(false)});let st=$('#sceneTitle');if(st)st.oninput=()=>{d.sceneTitles[d.scene]=st.value;saveDraft();paint()};bindScenes();let up=$('#upload');if(up)up.onchange=()=>{const f=up.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){notify('Choose a PNG, JPG or WebP image.');return}if(f.size>15e6){notify('Choose an image smaller than 15 MB.');return}const im=new Image;im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,1000/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.photo=c.toDataURL('image/jpeg',.64);saveDraft();render(false)};im.src=URL.createObjectURL(f)};let ed=$('#toEditor');if(ed)ed.onclick=()=>go('/editor');let sv=$('#saveProject');if(sv)sv.onclick=()=>{projects.unshift({...d,savedAt:new Date().toLocaleDateString()});if(saveProjects())notify('Project saved in this browser!');else{projects.shift();notify('Storage is full; try using a smaller image.')}};$$('[data-open]').forEach(b=>b.onclick=()=>{d={...d,...projects[Number(b.dataset.open)]};saveDraft();go('/editor')});$$('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this local draft?'))return;projects.splice(Number(b.dataset.delete),1);saveProjects();render(false)});let f=$('#contactForm');if(f)f.onsubmit=x=>{x.preventDefault();let subject='[Promo Studio] '+$('#topic').value,body='Name: '+$('#sender').value+'\nEmail: '+$('#email').value+'\n\n'+$('#message').value;location.href='mailto:davidhambern@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}}function render(scroll=true){const map={'/':welcome,'/home':home,'/studio':studio,'/editor':editor,'/projects':projectsPage,'/contact':contact,'/policies':policies};let path=location.pathname;$('#root').innerHTML=(map[path]||welcome)();$$('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===path));document.title=(path==='/'?'Welcome':path.slice(1))+' | Promo Studio';wire();$('.animated-feature .feature-art').forEach(b=>{b.addEventListener('click',()=>{const active=b.classList.toggle('is-active');b.setAttribute('aria-pressed',String(active))})});if(scroll)scrollTo(0,0)}addEventListener('popstate',()=>render(false));render(false)
})();
