name: Import approved Promo Studio artwork
on:
  push:
    paths:
      - ".github/workflows/import-promo-studio-artwork.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import_artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact customer-provided artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promo-studio-preview/v3/assets
          curl --fail --location --retry 3 --silent --show-error 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d0a03430-a28e-468e-b446-503cc4241875.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2FmMjdhNzQ5NTNjZmFkNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjY2NDY5Mn0.WNhTV27XGwA5Tv_cN9fg4TN3agbHJ5hGdsGYR_UX93k' --output "promo-studio-preview/v3/assets/no-rush.png"
          curl --fail --location --retry 3 --silent --show-error 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/82948ce5-a6c0-42d2-accd-5488031f73dc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzFmYThlZDE3OGMxMTg5YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjcwODA0OX0.QuPigXZ35Io0qmtY0XfhuoRAFL7HDmokrRzpgsUE7zU' --output "promo-studio-preview/v3/assets/cul-de-smack.png"
          curl --fail --location --retry 3 --silent --show-error 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/fe62fc72-0789-4add-a032-cae32766b720.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTQ3ZjhjZmUxY2Q5MDc2OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjY3MDMzNH0.uGGwHYrRJfNBKoMBU3tK2SKmGepft6TYmvivpqPBiUg' --output "promo-studio-preview/v3/assets/suit-and-sneakers.png"
          curl --fail --location --retry 3 --silent --show-error 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f5dacfa2-87b3-42a8-88ba-474ccf779a66.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDQyNjRmN2RlMmE5OThmMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mjc0MzgwNX0.-pSVMiRRvayBy2_1e9Vfy7v_S7OKinZD2C2rtwi5ufU' --output "promo-studio-preview/v3/assets/nobody-messes.png"
          file promo-studio-preview/v3/assets/*.png
      - name: Generate resized, uncropped card images
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("promo-studio-preview/v3/assets")
          names=["no-rush","cul-de-smack","suit-and-sneakers","nobody-messes"]
          for name in names:
              im=Image.open(p/f"{name}.png").convert("RGB")
              im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              im.save(p/f"{name}.webp",format="WEBP",quality=84,method=6)
              print(name,im.size)
          PY
      - name: Save permanent artwork files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo-studio-preview/v3/assets
          if ! git diff --cached --quiet; then
            git commit -m "Add original BernATune Promo Studio card artwork and fitted previews"
            git push
          fi
