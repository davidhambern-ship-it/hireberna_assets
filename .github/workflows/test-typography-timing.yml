name: Typography Playground Browser Timing Test
on:
  push:
    paths:
      - 'promo-studio-assets/cards/typography-playground/**'
      - 'scripts/test_typography_timing.mjs'
      - '.github/workflows/test-typography-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check font/selector alignment at desktop, mobile, and reduced motion
        run: node scripts/test_typography_timing.mjs
      - name: Save rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-sync-qa
          path: typography-*.png
          if-no-files-found: ignore
