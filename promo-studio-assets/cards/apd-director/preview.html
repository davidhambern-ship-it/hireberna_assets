<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · APD Creative Director</title><link rel="stylesheet" href="./motion.css"></head><body><main class="wrap"><h1>APD Creative Director</h1><p>The director gathers an idea, an image, copy and timed scenes into one assembled promo composition. Hover or press Tab/Enter to play; tap to toggle on touch.</p><button class="anim-card" id="demo" type="button" aria-label="Preview APD Creative Director animation" aria-pressed="false"><img class="layer-base" src="./base.svg" alt="" aria-hidden="true"><img class="layer-director-core" src="./director-core.svg" alt="" aria-hidden="true"><img class="layer-idea" src="./idea.svg" alt="" aria-hidden="true"><img class="layer-image" src="./image.svg" alt="" aria-hidden="true"><img class="layer-copy" src="./copy.svg" alt="" aria-hidden="true"><img class="layer-timeline" src="./timeline.svg" alt="" aria-hidden="true"><img class="layer-promo-frame" src="./promo-frame.svg" alt="" aria-hidden="true"><img class="layer-beam" src="./beam.svg" alt="" aria-hidden="true"><img class="layer-sparkles" src="./sparkles.svg" alt="" aria-hidden="true"></button><p id="state" aria-live="polite">Idle: ready to animate.</p></main><script>const d=document.getElementById('demo'),s=document.getElementById('state');d.onclick=()=>{const on=d.classList.toggle('is-active');d.setAttribute('aria-pressed',on);s.textContent=on?'Animation shown — tap again to reset':'Idle: ready to animate.'};</script></body></html>
