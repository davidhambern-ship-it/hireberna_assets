<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · Video Export & Publishing</title><link rel="stylesheet" href="./motion.css"></head><body><main class="wrap"><h1>Video Export & Publishing</h1><p>An illustrative MP4 rendering sequence fills the progress bar and lights up four platform destinations; this is a visual concept, not live publishing. Hover, focus with Tab, or tap to animate.</p><button class="anim-card" type="button" id="demo" aria-label="Preview animated Video Export & Publishing feature" aria-pressed="false"><img src="./base.svg" class="layer-base" alt="" aria-hidden="true"><img src="./video.svg" class="layer-video" alt="" aria-hidden="true"><img src="./mp4.svg" class="layer-mp4" alt="" aria-hidden="true"><img src="./progress-track.svg" class="layer-progress-track" alt="" aria-hidden="true"><img src="./progress-fill.svg" class="layer-progress-fill" alt="" aria-hidden="true"><img src="./send-arrow.svg" class="layer-send-arrow" alt="" aria-hidden="true"><img src="./youtube.svg" class="layer-youtube" alt="" aria-hidden="true"><img src="./instagram.svg" class="layer-instagram" alt="" aria-hidden="true"><img src="./facebook.svg" class="layer-facebook" alt="" aria-hidden="true"><img src="./tiktok.svg" class="layer-tiktok" alt="" aria-hidden="true"><img src="./check.svg" class="layer-check" alt="" aria-hidden="true"></button><p id="status" aria-live="polite">Idle — ready to preview.</p></main><script>const card=document.getElementById('demo'),status=document.getElementById('status');card.onclick=()=>{const active=card.classList.toggle('is-active');card.setAttribute('aria-pressed',active);status.textContent=active?'Hover animation held; press again to reset':'Idle — ready to preview.'};</script></body></html>
