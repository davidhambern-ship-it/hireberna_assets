<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · Artwork Library Hover Demo</title><link rel="stylesheet" href="./motion.css"></head><body><main class="preview-wrap"><h1>01 · Artwork Library</h1><p>Hover, focus or click the artwork cabinet. Files open and fan out as independent image layers. No cropping.</p><button class="library-card" id="card" type="button" aria-label="Open the digital artwork library animation" aria-pressed="false"><img class="base" src="./base.svg" alt="" aria-hidden="true"><img class="folder-closed" src="./folder-closed.svg" alt="" aria-hidden="true"><img class="folder-open" src="./folder-open.svg" alt="" aria-hidden="true"><img class="art-landscape" src="./art-landscape.svg" alt="" aria-hidden="true"><img class="art-portrait" src="./art-portrait.svg" alt="" aria-hidden="true"><img class="art-sticker" src="./art-sticker.svg" alt="" aria-hidden="true"><img class="art-logo" src="./art-logo.svg" alt="" aria-hidden="true"><img class="upload" src="./upload.svg" alt="" aria-hidden="true"><img class="cursor" src="./cursor.svg" alt="" aria-hidden="true"><img class="sparkles" src="./sparkles.svg" alt="" aria-hidden="true"></button><p class="status" id="status">Ready · hover, Tab + focus, or tap</p></main><script>const b=document.getElementById('card'),s=document.getElementById('status');b.addEventListener('click',()=>{const on=b.classList.toggle('is-active');b.setAttribute('aria-pressed',on);s.textContent=on?'Library open — all assets displayed':'Ready · hover, Tab + focus, or tap'});</script></body></html>
