<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · Typography Playground</title><link rel="stylesheet" href="./motion.css"></head><body><main class="wrap"><h1>Typography Playground</h1><p>The large sample cycles from modern sans to elegant serif and lands on a bold display font. Hover, focus with Tab, or tap to animate.</p><button class="anim-card" type="button" id="demo" aria-label="Preview animated Typography Playground feature" aria-pressed="false"><img src="./base.svg" class="layer-base" alt="" aria-hidden="true"><img src="./type-modern.svg" class="layer-type-modern" alt="" aria-hidden="true"><img src="./type-serif.svg" class="layer-type-serif" alt="" aria-hidden="true"><img src="./type-bold.svg" class="layer-type-bold" alt="" aria-hidden="true"><img src="./chip-modern.svg" class="layer-chip-modern" alt="" aria-hidden="true"><img src="./chip-serif.svg" class="layer-chip-serif" alt="" aria-hidden="true"><img src="./chip-bold.svg" class="layer-chip-bold" alt="" aria-hidden="true"><img src="./selector.svg" class="layer-selector" alt="" aria-hidden="true"><img src="./sparkles.svg" class="layer-sparkles" alt="" aria-hidden="true"></button><p id="status" aria-live="polite">Idle — ready to preview.</p></main><script>const card=document.getElementById('demo'),status=document.getElementById('status');card.onclick=()=>{const active=card.classList.toggle('is-active');card.setAttribute('aria-pressed',active);status.textContent=active?'Hover animation held; press again to reset':'Idle — ready to preview.'};</script></body></html>
