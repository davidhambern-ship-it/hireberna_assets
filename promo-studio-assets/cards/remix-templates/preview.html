<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · Ready-to-Remix Templates</title><link rel="stylesheet" href="./motion.css"></head><body><main class="wrap"><h1>Ready-to-Remix Templates</h1><p>An editable blank promo becomes a vivid personalized layout with real art, typography, CTA and palette controls. Hover or press Tab/Enter to play; tap to toggle on touch.</p><button class="anim-card" id="demo" type="button" aria-label="Preview Ready-to-Remix Templates animation" aria-pressed="false"><img class="layer-base" src="./base.svg" alt="" aria-hidden="true"><img class="layer-template-blank" src="./template-blank.svg" alt="" aria-hidden="true"><img class="layer-template-ready" src="./template-ready.svg" alt="" aria-hidden="true"><img class="layer-user-image" src="./user-image.svg" alt="" aria-hidden="true"><img class="layer-headline" src="./headline.svg" alt="" aria-hidden="true"><img class="layer-cta" src="./cta.svg" alt="" aria-hidden="true"><img class="layer-palette" src="./palette.svg" alt="" aria-hidden="true"><img class="layer-cursor" src="./cursor.svg" alt="" aria-hidden="true"><img class="layer-sparkles" src="./sparkles.svg" alt="" aria-hidden="true"></button><p id="state" aria-live="polite">Idle: ready to animate.</p></main><script>const d=document.getElementById('demo'),s=document.getElementById('state');d.onclick=()=>{const on=d.classList.toggle('is-active');d.setAttribute('aria-pressed',on);s.textContent=on?'Animation shown — tap again to reset':'Idle: ready to animate.'};</script></body></html>
