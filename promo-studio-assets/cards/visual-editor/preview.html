<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promo Studio · Visual Editor</title><link rel="stylesheet" href="./motion.css"></head><body><main class="wrap"><h1>Visual Editor</h1><p>A messy mini layout is arranged with snap guides; a confirmation chip appears when the composition locks in. Hover, focus with Tab, or tap to animate.</p><button class="anim-card" type="button" id="demo" aria-label="Preview animated Visual Editor feature" aria-pressed="false"><img src="./base.svg" class="layer-base" alt="" aria-hidden="true"><img src="./artwork.svg" class="layer-artwork" alt="" aria-hidden="true"><img src="./headline.svg" class="layer-headline" alt="" aria-hidden="true"><img src="./sticker.svg" class="layer-sticker" alt="" aria-hidden="true"><img src="./guides.svg" class="layer-guides" alt="" aria-hidden="true"><img src="./handles.svg" class="layer-handles" alt="" aria-hidden="true"><img src="./cursor.svg" class="layer-cursor" alt="" aria-hidden="true"><img src="./finish.svg" class="layer-finish" alt="" aria-hidden="true"><img src="./sparkles.svg" class="layer-sparkles" alt="" aria-hidden="true"></button><p id="status" aria-live="polite">Idle — ready to preview.</p></main><script>const card=document.getElementById('demo'),status=document.getElementById('status');card.onclick=()=>{const active=card.classList.toggle('is-active');card.setAttribute('aria-pressed',active);status.textContent=active?'Hover animation held; press again to reset':'Idle — ready to preview.'};</script></body></html>
